# Codemagic CI/CD — shogi-kakoi-trainer (Next.js + Capacitor iOS) → TestFlight
#
# Repository: kaeru07/shogi-kakoi-trainer
# App directory: repository root
#
# Ported from the working mahjong-trainer configuration in kaeru07/ny01.
# Only the Bundle ID, provisioning profile reference, display names and
# working directory differ. The mahjong provisioning profile itself is not
# reusable because profiles are per Bundle ID, so the register workflow
# below creates a shogi-specific one.
#
# Secrets are not stored here. App Store Connect integration, distribution
# certificate, and provisioning profile references must exist in Codemagic UI.

workflows:
  # One-shot: register the Bundle ID on Apple Developer Portal via the ASC API
  # key integration. Needed once before automatic code signing can create
  # provisioning profiles for a new app.
  register-bundle-id:
    name: Register Bundle ID (shogi-kakoi-trainer)
    max_build_duration: 10
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ASC_API_KEY
    environment:
      vars:
        BUNDLE_ID: "com.kaeru07.shogikakoi"
    scripts:
      - name: Ensure app store profile exists
        script: |
          set -e
          # cli-tools mixes ANSI-colored log lines into stdout; strip them and
          # locate the JSON payload at a line start before parsing.
          json_id() { python3 -c "
          import sys, json, re
          s = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', sys.stdin.read())
          for i in [i for i in range(len(s)) if s[i] in '[{' and (i == 0 or s[i-1] == '\n')]:
              try:
                  d = json.loads(s[i:])
                  break
              except Exception:
                  continue
          else:
              sys.exit('no json in input')
          d = d if isinstance(d, list) else [d]
          print(' '.join(r['id'] for r in d))
          "; }
          echo "== bundle id =="
          BUNDLE_RES_ID=$(app-store-connect list-bundle-ids --bundle-id-identifier "$BUNDLE_ID" --platform IOS --json | json_id)
          if [ -z "$BUNDLE_RES_ID" ]; then
            echo "bundle id not registered yet - creating"
            app-store-connect bundle-ids create "$BUNDLE_ID" --platform IOS || app-store-connect create-bundle-id --bundle-id-identifier "$BUNDLE_ID" --platform IOS
            BUNDLE_RES_ID=$(app-store-connect list-bundle-ids --bundle-id-identifier "$BUNDLE_ID" --platform IOS --json | json_id)
          fi
          if [ -z "$BUNDLE_RES_ID" ]; then
            echo "ERROR: bundle id resource id could not be resolved"
            exit 1
          fi
          echo "bundle id resource: $BUNDLE_RES_ID"
          echo "== distribution certificates =="
          CERT_IDS=$(app-store-connect list-certificates --type DISTRIBUTION --json | json_id || true)
          if [ -z "$CERT_IDS" ]; then
            CERT_IDS=$(app-store-connect list-certificates --type IOS_DISTRIBUTION --json | json_id || true)
          fi
          echo "cert ids: $CERT_IDS"
          if [ -z "$CERT_IDS" ]; then
            echo "ERROR: no distribution certificate found in the Apple Developer account"
            exit 1
          fi
          echo "== ensure app store profile (idempotent) =="
          PROFILE_NAME="shogi-kakoi-trainer app_store"
          filter_ids() { python3 -c "
          import sys, json, re
          name = sys.argv[1]
          s = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', sys.stdin.read())
          start = next((i for i in range(len(s)) if s[i] in '[{' and (i == 0 or s[i-1] == '\n')), None)
          data = json.loads(s[start:]) if start is not None else []
          data = data if isinstance(data, list) else [data]
          print(' '.join(r['id'] for r in data if r.get('attributes', {}).get('name') == name))
          " "$PROFILE_NAME"; }
          EXISTING=$(app-store-connect profiles list --json 2>/dev/null | filter_ids || true)
          if [ -n "$EXISTING" ]; then
            echo "profile '$PROFILE_NAME' already exists (${EXISTING}) — skip create"
          else
            app-store-connect profiles create "$BUNDLE_RES_ID" \
              --type IOS_APP_STORE \
              --name "$PROFILE_NAME" \
              --certificate-ids $CERT_IDS
          fi

  shogi-kakoi-trainer-ios-testflight:
    name: Shogi Kakoi Trainer iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: ASC_API_KEY

    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.kaeru07.shogikakoi"
        APP_VERSION: "1.0"
        # BUILD_NUMBER は固定しない。Codemagic 組み込みの自動採番 $BUILD_NUMBER
        # (プロジェクトのビルド連番) を使う。固定値だと App Store Connect が
        # 同じビルド番号の再アップロードを拒否し "Publishing failed" になる。
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      ios_signing:
        certificates:
          - IOS_DISTRIBUTION_CERTIFICATE
        provisioning_profiles:
          - SHOGI_KAKOI_TRAINER_APP_STORE_PROFILE

    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install

      - name: Build Next.js static app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Set iOS app version
        script: |
          set -e
          # Codemagic 組み込みの $BUILD_NUMBER(自動採番・毎ビルド増加)を使う。
          # 空なら現在時刻から一意な番号を生成して重複を避ける。
          BUILD_NO="${BUILD_NUMBER:-$(date +%Y%m%d%H%M)}"
          echo "Using build number: $BUILD_NO"
          cd ios/App
          agvtool new-marketing-version "$APP_VERSION"
          agvtool new-version -all "$BUILD_NO"

      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles
          echo "--- provisioning profiles in keychain dir ---"
          ls -1 "$HOME/Library/MobileDevice/Provisioning Profiles" 2>/dev/null || echo "(none)"

      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/outputs/**/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
